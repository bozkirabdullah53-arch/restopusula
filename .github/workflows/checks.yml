name: Build and business flows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify isolated business flows
        run: python -m unittest discover -s backend/tests -v
      - name: Build offline preview
        run: python scripts/make_preview.py
      - name: Install browser checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify translated and responsive interface
        run: python scripts/check_ui.py
      - name: Save preview and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restopusula-preview
          path: |
            Onizleme.html
            docs/index.html
            ui-checks/
          retention-days: 14
