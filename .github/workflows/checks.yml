name: Build and business flows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Prepare restaurant visual
        run: |
          python -m pip install Pillow
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image
          directory = Path('frontend/public/images')
          target = directory / 'restaurant-interior.webp'
          Image.open(directory / 'restaurant-interior.png').save(target, 'WEBP', quality=83, method=6)
          encoded = base64.b64encode(target.read_bytes()).decode('ascii')
          for index in range(0, len(encoded), 6000):
              print(f'RWEBP:{index // 6000:04d}:' + encoded[index:index + 6000])
          PY
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify isolated business flows
        run: python -m unittest discover -s backend/tests -v
      - name: Build offline preview
        run: python scripts/make_preview.py
      - name: Install browser checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify translated and responsive interface
        run: python scripts/check_ui.py
      - name: Export review bytes
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for prefix, path in [('RPREVIEW', Path('Onizleme.html')), ('RSHOT', Path('ui-checks/dashboard-1440.jpg'))]:
              if not path.exists():
                  continue
              encoded = base64.b64encode(path.read_bytes()).decode('ascii')
              for index in range(0, len(encoded), 6000):
                  print(f'{prefix}:{index // 6000:04d}:' + encoded[index:index + 6000])
          PY
      - name: Save preview and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restopusula-preview
          path: |
            Onizleme.html
            ui-checks/
          retention-days: 14
